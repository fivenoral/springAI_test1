# Spring Boot 应用名称
spring.application.name=springAI_test1

# 激活 local profile：加载被 git 忽略的 application-local.properties（存放真实密钥）
# 其中的同名属性会覆盖本文件里的 ${ENV} 占位符；本文件仅作为提交到 git 的“模板”
spring.profiles.active=local

# 排除 MCP SSE 自动配置（仅使用 stdio 客户端）
spring.autoconfigure.exclude=org.springframework.ai.mcp.client.common.autoconfigure.McpSseClientAutoConfiguration
# ============================
# MCP 配置
# ============================
spring.ai.mcp.client.stdio.connections.my-calculator-server.command=java
spring.ai.mcp.client.stdio.connections.my-calculator-server.args[0]=-jar
spring.ai.mcp.client.stdio.connections.my-calculator-server.args[1]=./springAI_MCP.jar
spring.ai.mcp.client.stdio.connections.my-calculator-server.env.LOGGING_LEVEL_ROOT=ERROR
spring.ai.mcp.client.stdio.connections.my-calculator-server.env.SPRING_MAIN_BANNER-MODE=off
spring.ai.mcp.client.stdio.connections.my-calculator-server.env.SPRING_JPA_SHOW-SQL=false
spring.ai.mcp.client.stdio.connections.my-calculator-server.env.LOGGING_LEVEL_ORG_HIBERNATE=ERROR
spring.ai.mcp.client.stdio.connections.my-calculator-server.env.LOGGING_LEVEL_ORG_HIBERNATE_SQL=ERROR

# ============================
# MySQL + JPA 配置
# ============================
spring.datasource.url=jdbc:mysql://localhost:3306/spring_ai_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================
# OpenAI 配置
# ============================
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=https://api.openai.com
spring.ai.openai.chat.options.model=gpt-4o

# ============================
# DeepSeek 配置（通过 OpenAI 兼容接口）
# ============================
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY}
spring.ai.deepseek.base-url=https://aigw.telecomjs.com/v1
spring.ai.deepseek.chat.options.model=deepseek-v4-pro

# ============================
# 通义千问 Qwen 配置（通过 DashScope OpenAI 兼容接口）
# ============================
spring.ai.qwen.api-key=${DASHSCOPE_API_KEY}
spring.ai.qwen.base-url=https://aigw.telecomjs.com/v1
spring.ai.qwen.chat.options.model=qwen3.7-max

# Qwen 图像生成/编辑模型（电信网关）
spring.ai.qwen.image.model=qwen-image-edit-plus

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 图片上传存储目录（相对路径，运行时解析为绝对路径）
app.upload.dir=uploads


spring.ai.ollama.init.pull-model-strategy=when_missing
spring.ai.ollama.embedding.options.model=nomic-embed-text
spring.ai.ollama.init.chat.include=false

# 让 Ollama 成为容器内唯一的 EmbeddingModel（关闭 OpenAI embedding 自动装配）。
# ChromaVectorStore 自动装配按类型注入单个 EmbeddingModel，若同时存在 OpenAI+Ollama
# 两个 Bean 会抛 NoUniqueBeanDefinitionException，故这里显式指定 embedding provider。
spring.ai.model.embedding=ollama

# ============================
# Chroma 向量库（持久化，远程实例 / Chroma Cloud）
# ============================
# host 需带协议头；Chroma Cloud 走 https + 443
spring.ai.vectorstore.chroma.client.host=https://api.trychroma.com
spring.ai.vectorstore.chroma.client.port=443
# 真实 token 在 application-local.properties 中覆盖（已 gitignore）
spring.ai.vectorstore.chroma.client.key-token=${CHROMA_API_TOKEN}
spring.ai.vectorstore.chroma.tenant-name=9be08a25-596c-47f8-9dd4-c26b6f219fdb
spring.ai.vectorstore.chroma.database-name=dev
spring.ai.vectorstore.chroma.collection-name=collect_test
# 首次启动自动创建 collection（若不存在）
spring.ai.vectorstore.chroma.initialize-schema=true

