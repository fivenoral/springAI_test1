spring.application.name=springAI_test1

# ============================
# MySQL + JPA 配置
# ============================
spring.datasource.url=jdbc:mysql://localhost:3306/spring_ai_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================
# OpenAI 配置
# ============================
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-your-openai-api-key}
spring.ai.openai.base-url=https://api.openai.com
spring.ai.openai.chat.options.model=gpt-4o

# ============================
# DeepSeek 配置（通过 OpenAI 兼容接口）
# ============================
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:sk-1xzzzBm5pYwsykZjbBBc5Ube2wnLLH3m}
spring.ai.deepseek.base-url=https://aigw.telecomjs.com/v1
spring.ai.deepseek.chat.options.model=deepseek-v4-pro

# ============================
# 通义千问 Qwen 配置（通过 DashScope OpenAI 兼容接口）
# ============================
#sk-PcDraK8eWvr7XLFbiKKNpghJUEHbAabk（电信）
spring.ai.qwen.api-key=${DASHSCOPE_API_KEY:sk-CNnVYKlfYpj9AOsf6E6LTrUrQeUunYoh}
spring.ai.qwen.base-url=https://aigw.telecomjs.com/v1
spring.ai.qwen.chat.options.model=qwen3.7-max

# Qwen 图像生成/编辑模型（电信网关）
spring.ai.qwen.image.model=qwen-image-edit-plus

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 图片上传存储目录（相对路径，运行时解析为绝对路径）
app.upload.dir=uploads
