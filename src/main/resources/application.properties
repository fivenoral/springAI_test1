spring.application.name=springAI_test1

# ============================
# MySQL + JPA 配置
# ============================
spring.datasource.url=jdbc:mysql://localhost:3306/spring_ai_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================
# OpenAI 配置
# ============================
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-your-openai-api-key}
spring.ai.openai.base-url=https://api.openai.com
spring.ai.openai.chat.options.model=gpt-4o

# ============================
# DeepSeek 配置（通过 OpenAI 兼容接口）
# ============================
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:sk-your-deepseek-api-key}
spring.ai.deepseek.base-url=https://api.deepseek.com
spring.ai.deepseek.chat.options.model=deepseek-chat

# ============================
# 通义千问 Qwen 配置（通过 DashScope OpenAI 兼容接口）
# ============================
spring.ai.qwen.api-key=${DASHSCOPE_API_KEY:sk-ws-H.EMELDLE.JO6V.MEYCIQDXhNs1oH5hcTm_G1nwIVzUkU3vjHGjyh4LPYyRIwCkhQIhAIlOQNKFtUtgLMKfgwDeCDg2nwtUJr4x9OeJ_sZ9f_zR}
spring.ai.qwen.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
